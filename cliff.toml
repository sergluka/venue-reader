[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits %}\
- {{ commit.message }}{% if commit.breaking %} **Breaking change.**{% endif %}
{% endfor %}\
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Normalize the historical merge before parsing, then exclude it by SHA.
commit_preprocessors = [
  { pattern = '^Merge pull request #1 from sergluka/first-server-release\n', replace = "chore: merge first server release\n" },
]
commit_parsers = [
  { sha = "4a03c7c909755bef6027603a3aedd998bca9cf78", skip = true },
  { field = "breaking", pattern = "true", group = "Breaking changes" },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = ".*", skip = true },
]
ignore_tags = 'v[0-9]+\.[0-9]+\.[0-9]+-.*'
sort_commits = "oldest"
