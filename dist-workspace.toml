[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.1"
ci = "github"
installers = ["shell", "powershell"]
install-path = "~/.local/bin"
# Upload preview artifacts without publishing a release.
pr-run-mode = "upload"
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
unix-archive = ".tar.gz"
windows-archive = ".zip"
checksum = "sha256"
include = [
  "LICENSE",
  "NOTICE",
  "THIRD_PARTY_LICENSES.txt",
  "DEPENDENCY_LICENSES.txt",
]
source-tarball = true
default-features = true
all-features = false
features = []
msvc-crt-static = true
local-artifacts-jobs = ["./check-release-config"]
publish-jobs = []
github-release = "announce"
github-build-setup = "../release-build-setup.yml"

[dist.github-custom-runners]
global = "ubuntu-22.04"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
x86_64-apple-darwin = "macos-15-intel"
aarch64-apple-darwin = "macos-14"
x86_64-pc-windows-msvc = "windows-2022"

[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"          # v6
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9"   # v7
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8
"swatinem/rust-cache" = "d1527c8f67ef9af357290475d4af4b0fab8f12e0"       # v2
