[package]
name = "venue-reader"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
description = "LSP server for FIX protocol logs"
repository = "https://github.com/sergluka/venue-reader"

[build-dependencies]
roxmltree = "0.21"
# Same hash on both sides: build.rs stamps the generated tables, the registry
# hashes dictionary bytes, and the analysis fingerprint mixes the two.
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dependencies]
lsp-server = "0.10"
lsp-types = { package = "gen-lsp-types", version = "0.11", features = ["url"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
crossbeam-channel = "0.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
log = { version = "0.4", features = ["std"] }
roxmltree = "0.21"
thiserror = "2"
toml = "1.1"
globset = "0.4"
percent-encoding = "2"

# Both dev-only and both off by default: they exist for work-order item 16,
# which measures what the line cache is worth. `bench-cache-stats` counts hits and
# misses; `bench-no-line-cache` is the counterfactual — the same runs without a cache,
# measured rather than modelled.
[features]
bench-cache-stats = []
bench-no-line-cache = []

[dev-dependencies]
proptest = "1"
sha2 = "0.11"
criterion = { version = "0.8", default-features = false, features = [
  "cargo_bench_support",
] }

[[bench]]
name = "analyze"
harness = false

[[bench]]
name = "lens_list"
harness = false

[[bench]]
name = "tokens"
harness = false

[[bench]]
name = "hint_payload"
harness = false

[[bench]]
name = "cache_sequence"
harness = false
required-features = ["bench-cache-stats"]

[[bench]]
name = "rss_sequence"
harness = false

[[bench]]
name = "rss_scroll"
harness = false

[[bench]]
name = "rss_viewport"
harness = false

[[bench]]
name = "rss_transient"
harness = false

[[bench]]
name = "rss_diagnostics"
harness = false

[[bench]]
name = "cache_cost"
harness = false

[profile.release]
strip = true

[profile.dist]
inherits = "release"
lto = "thin"
