# cargo-deny configuration. Run: `cargo deny check`.

[advisories]
version = 2
yanked = "deny"

# Dependency licence allow-list: cargo-deny rejects any licence not listed here.
[licenses]
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "BSL-1.0",
  "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
