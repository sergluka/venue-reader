version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:17"
      timezone: Etc/UTC
    groups:
      cargo-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:17"
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci(deps)
