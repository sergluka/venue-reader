name: Release installer verification

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify installer (${{ join(matrix.targets, ', ') }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.plan).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: artifacts-build-global
          path: artifacts
      - name: Install on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        env:
          VENUE_READER_UNMANAGED_INSTALL: ${{ runner.temp }}/installed-venue-reader
        run: |
          export VENUE_READER_DOWNLOAD_URL="file://$PWD/artifacts"
          sh ./artifacts/venue-reader-installer.sh
          echo "VENUE_READER_TEST_BINARY=$VENUE_READER_UNMANAGED_INSTALL/venue-reader" >> "$GITHUB_ENV"
      - name: Install on Windows
        if: runner.os == 'Windows'
        shell: powershell
        env:
          VENUE_READER_UNMANAGED_INSTALL: ${{ runner.temp }}/installed-venue-reader
        run: |
          $env:VENUE_READER_DOWNLOAD_URL = ([uri](Resolve-Path artifacts).Path).AbsoluteUri
          & ./artifacts/venue-reader-installer.ps1
          "VENUE_READER_TEST_BINARY=$env:VENUE_READER_UNMANAGED_INSTALL/venue-reader.exe" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Exercise the installed server
        run: cargo test --locked --test stdio_e2e release_artifact_smoke -- --exact
