# Source checks shared by branch CI and the release pipeline.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all
      - run: python3 -m unittest discover -s tools

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check MSRV
        shell: bash
        run: |
          minimum_rust_version="$(cargo metadata --locked --no-deps --format-version=1 | jq -er '.packages[0].rust_version')"
          if [[ "$minimum_rust_version" != *.*.* ]]; then
            minimum_rust_version="${minimum_rust_version}.0"
          fi
          rustup toolchain install "$minimum_rust_version" --profile minimal --no-self-update
          cargo +"$minimum_rust_version" check --locked --all-targets

  ruff:
    name: ruff (tools/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned so a ruff release cannot fail CI with rules nobody chose.
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3
        with:
          version: "0.16.8"
          args: check tools

  deny:
    uses: ./.github/workflows/dependency-checks.yml
